name: Bootstrap
run-name: "Bootstrap ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    paths-ignore: ['documentation/**', '**.rst', '**.md']
  pull_request:
    paths-ignore: ['documentation/**', '**.rst', '**.md']

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Dependencies
        run: |
            if [ "$RUNNER_OS" == "Linux" ]; then
              sudo apt-get install libgc-dev
            fi
            if [ "$RUNNER_OS" == "macOS" ]; then
              brew install autoconf automake bdw-gc
            fi
        shell: bash
      - name: Install bootstrap compiler
        run: |
            if [ "$RUNNER_OS" == "Linux" ]; then
              curl -LO https://github.com/dylan-lang/opendylan/releases/download/v2024.1.0/opendylan-2024.1-x86_64-linux.tar.bz2
              tar xvf opendylan-2024.1-x86_64-linux.tar.bz2
            fi
            if [ "$RUNNER_OS" == "macOS" ]; then
              curl -LO https://github.com/dylan-lang/opendylan/releases/download/v2024.1.0/opendylan-2024.1-x86_64-darwin.tar.bz2
              tar xvf opendylan-2020.1-x86_64-darwin.tar.bz2
            fi
            echo "`pwd`/opendylan-2024.1/bin" >> $GITHUB_PATH
      - name: Generate configure
        run: ./autogen.sh
      - name: Configure
        run: ./configure
      - name: Build
        run: make
      - name: Run Tests
        run: make check
